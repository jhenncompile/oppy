# Blueprint GRATIS de Oppy en Render.
#
# - Front: static (siempre gratis)
# - API: plan free (se duerme ~15 min sin trafico; cold start ~30-60s)
# - DB: NO se provisiona aca — usa tu Supabase (ya la tenes)
# - Cron aparte: NO (es de pago). Opcional: CRON_ENABLED=true en la API
#   (solo corre si el servicio esta despierto)
#
# Tradeoff del free: la primera visita tras dormir puede tardar un minuto.
# Para demo en vivo, abre /health 1-2 min antes.

services:
  - type: web
    name: oppy-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Despues de crear oppy-api: https://oppy-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: oppy-api
    region: oregon
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pegar el Session pooler de Supabase (el mismo que usas en local).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      # Cron embebido: sin servicio cron de pago. Con free, solo corre si
      # alguien desperto la API recientemente.
      - key: CRON_ENABLED
        value: 'true'
      - key: CRON_SCHEDULE
        value: '0 6 * * *'
      - key: CORS_ORIGIN
        sync: false
      # Agente Modal (obligatorio en produccion)
      - key: OPPY_API_URL
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: ZAVUDEV_API_KEY
        sync: false
      - key: NOTIF_MATCH_THRESHOLD
        value: '80'
      - key: DEMO_MODE
        value: 'false'
