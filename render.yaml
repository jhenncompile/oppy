# Infraestructura de Oppy en Render.
#
# Dos servicios: la API (que ademas expone el stream de progreso) y un cron job
# que corre el MISMO pipeline en un proceso aparte.
#
# El cron embebido en la API (CRON_ENABLED=true) y este cron job son
# alternativas, no complementos: activar los dos duplicaria el descubrimiento.
#
# La base NO se provisiona aca: vive en Supabase y los dos servicios reciben la
# misma DATABASE_URL como secreto. Es la unica forma de que la API y el cron
# compartan indice — que es la decision que sostiene el costo por usuario.
# Ver docs/11-supabase.md.

services:
  - type: web
    name: oppy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Cadena del Session pooler de Supabase. Secreto: no vive en el repo.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      # El cron vive en su propio servicio, no dentro de la API.
      - key: CRON_ENABLED
        value: 'false'
      - key: CORS_ORIGIN
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      # Notificaciones — https://zavu.dev
      - key: ZAVUDEV_API_KEY
        sync: false
      - key: NOTIF_MATCH_THRESHOLD
        value: '80'
      # El catalogo de ejemplo es solo para desarrollo local. Aca se deja
      # explicito en false: una demo con datos de mentira no vale nada.
      - key: DEMO_MODE
        value: 'false'

  - type: cron
    name: oppy-descubrimiento
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    # 06:00 UTC ~ 02:00 en Bolivia: fuera del horario de uso.
    schedule: '0 6 * * *'
    startCommand: npm run cron
    envVars:
      - key: NODE_ENV
        value: production
      # Cadena del Session pooler de Supabase. Secreto: no vive en el repo.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      # El cron es quien notifica: sin esta clave descubre pero no avisa.
      - key: ZAVUDEV_API_KEY
        sync: false
      - key: NOTIF_MATCH_THRESHOLD
        value: '80'
      - key: DEMO_MODE
        value: 'false'
